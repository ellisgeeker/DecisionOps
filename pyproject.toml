[project]
name = "decisionops"
version = "0.1.1"
description = "Reliability infrastructure for AI decision models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "DecisionOps Contributors" }]
keywords = [
  "calibration",
  "selective-prediction",
  "conformal-risk",
  "decision-models",
  "reliability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "scikit-learn>=1.5",
  # Imported directly (temperature fit, Clopper-Pearson); not only via sklearn.
  "scipy>=1.13",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# HuggingFace intent benchmarks → DecisionOps JSONL + sklearn probs
bench = [
  "datasets>=2.20",
]
# Hosted TypeSafe Jev (System One) decision model provider
jev = [
  "typesafe-sdk==0.7.2",
]
# Local Laya (System-One) decision model provider
laya = [
  "datasets>=2.20",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.48",
]

[project.scripts]
decisionops = "decisionops.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Coverage gate lives in CI (.github/workflows/ci.yml --cov-fail-under=85).
# Local `uv run pytest` stays fast; opt in with --cov when you want a report.
[tool.coverage.run]
source = ["decisionops"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/decisionops/report/html.py" = ["E501"]
